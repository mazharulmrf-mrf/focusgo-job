name: Scrape govt job circulars
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
  push:
    paths: ["*.zip", "data/manual.json"]

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip if a zip was uploaded
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -x ".github/*"
            rm -f "$z"
          done

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/scrape-jobs.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit if changed
        run: |
          git config user.name  "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "chore: update" && git push)
