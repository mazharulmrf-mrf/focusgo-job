name: Scrape govt job circulars
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  push:
    paths: ["*.zip", "data/manual.json", "scripts/**", "package.json", ".github/workflows/scrape-jobs.yml"]

permissions:
  contents: write

concurrency:
  group: scrape-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip if a zip was uploaded
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -x ".github/*"
            rm -f "$z"
          done
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - run: node scripts/scrape-jobs.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "jobs-bot"
          git config user.email "jobs-bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "chore: update"
          # Run চলার সময় repo-তে অন্য commit এলে push reject হয় — তাই pull করে আবার চেষ্টা করে।
          # jobs.json generated file, conflict হলে bot-এর version-টাই থাকবে (-X theirs)।
          for i in 1 2 3 4 5; do
            git pull --no-rebase -X theirs origin main && git push && exit 0
            echo "Push rejected, retry $i..."
            sleep 10
          done
          echo "Push failed after retries" && exit 1
